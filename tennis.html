<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎾 Tennis | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#10b981,#059669,#10b981);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#6ee7b7;text-shadow:0 0 30px #10b98144}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#10b98133}
.slide-content li::before{content:'\25B8 ';color:#10b981;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#10b981,#059669);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #10b98144}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #10b98166}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#6ee7b7;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#10b98144}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#10b981;transform:scale(1.4);box-shadow:0 0 10px #10b98166}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#10b981;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #10b98166}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "Tennis", "subtitle": "Game, Set, Match", "content": "1 Milliarde Fans | Grand Slams seit 1877 | Einzel- und Teamsport", "is_title": true, "img": "https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=800&q=80"}, {"title": "Steckbrief", "bullets": ["Ursprung: Frankreich (Jeu de Paume, 12. Jh.), modernes Tennis: England, 1873", "Spieler weltweit: ~87 Millionen aktiv", "Fans: ~1 Milliarde", "Feld: 23,77 m x 8,23 m (Einzel)", "Belaege: Hartplatz, Sand, Rasen, Teppich", "Spielvarianten: Einzel, Doppel, Mixed, Rollstuhltennis"], "img": "https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?w=800&q=80"}, {"title": "Regeln & Spielprinzip", "bullets": ["Zaehlweise: Punkte 0 (Love), 15, 30, 40, Game, Set, Match", "Tiebreak: Bei 6:6 im Set", "Aufschlag: 2 Versuche, Fussfehler moeglich", "Schlaegertypen: Vorhand, Rueckhand, Slice, Topspin, Volley", "Let-Ball: Netzroller beim Aufschlag = Wiederholung", "Hawk-Eye: Elektronische Linienueberwachung seit 2006"], "img": "https://images.unsplash.com/photo-1587280501635-68a0e82cd5ff?w=800&q=80"}, {"title": "Geschichte", "bullets": ["12. Jh.: Jeu de Paume in Frankreich - mit der Handflaeche", "1873: Major Wingfield patentiert Vorlaeufer des modernen Tennis", "1877: Erstes Wimbledon - aeltestes Tennisturnier", "1968: Open Era - Profis duerfen an allen Turnieren teilnehmen", "1990er: Sampras-Aera (14 Grand-Slam-Titel)", "2000er-2020er: Federer-Nadal-Djokovic - 66 Slams zusammen!"], "img": "https://images.unsplash.com/photo-1527153907251-a5765e3e6ab2?w=800&q=80"}, {"title": "Groesste Turniere", "bullets": ["Wimbledon: Seit 1877, Rasen, aeltestes und prestigetraechtigstes Turnier", "US Open: Hartplatz, NYC - Preisgeld 65 Mio $ (2024)", "Roland Garros: Sandplatz, Paris - Nadal dominierte (14 Titel!)", "Australian Open: Hartplatz, Melbourne - Saisonauftakt", "ATP Finals: Top 8 der Weltrangliste am Saisonende", "Davis Cup: Nationen-Wettbewerb seit 1900"], "img": "https://images.unsplash.com/photo-1551773188-d63e5d01f6d7?w=800&q=80"}, {"title": "Beruehmte Spieler", "bullets": ["Novak Djokovic - 24 Grand-Slam-Titel, Rekordhalter", "Rafael Nadal - Koenig von Paris, 14x Roland-Garros-Sieger", "Roger Federer - Eleganz pur, 20 Slams, 103 ATP-Titel", "Serena Williams - 23 Grand-Slam-Titel, dominante Aera", "Steffi Graf - Golden Slam 1988 (alle 4 Slams + Olympia in einem Jahr!)"], "img": "https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?w=800&q=80"}, {"title": "Fun Facts", "bullets": ["Schnellster Aufschlag: 263 km/h (Sam Groth, 2012)", "Laengstes Match: Isner vs. Mahut, Wimbledon 2010 - 11h 5min ueber 3 Tage!", "Tennisbaelle: Gelb wurde erst 1972 eingefuehrt (vorher weiss)", "Wimbledon-Tradition: 28.000 kg Erdbeeren + 7.000 Liter Sahne pro Turnier", "Steffi Grafs Golden Slam 1988 ist bis heute einzigartig", "Ein Tennisschlaeger hat ~800 Quadratzoll Flaeche - geregelt!"], "img": "https://images.unsplash.com/photo-1600285340525-c24e3b0a19f2?w=800&q=80"}, {"title": "Quellen", "bullets": ["ATPTour.com - Weltrangliste und Statistiken", "Wimbledon.com - Offizielles Archiv", "Wikipedia - Tennis", "ITF Tennis - Regeln und Geschichte", "WTATennis.com - Damentennis"], "img": null}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
