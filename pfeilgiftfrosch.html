<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 Pfeilgiftfrosch | Tier-Welt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:6px;background:linear-gradient(135deg,#064e3b,#059669)}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 40px 120px;position:relative;min-height:calc(100vh - 6px)}
.slide-bg{position:absolute;inset:0;background:linear-gradient(135deg,#064e3b,#059669);opacity:.12}
.slide-content{position:relative;z-index:1;max-width:800px;width:100%;text-align:center}
.slide-content h1{font-size:2.4rem;margin-bottom:16px;color:#6ee7b7}
.slide-content .latin{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:12px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(30,41,59,.6)}
.slide-content li::before{content:'▸ ';color:#10b981;font-weight:bold}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(30,41,59,.95);border-top:1px solid #334155;backdrop-filter:blur(12px);z-index:50}
.nav button{background:#10b981;color:#0f172a;border:none;padding:12px 28px;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .2s}
.nav button:hover:not(:disabled){transform:scale(1.05)}
.nav button:disabled{opacity:.25;cursor:default}
.counter{color:#94a3b8;font-size:.9rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#6ee7b7;text-decoration:none;font-size:.95rem;background:rgba(15,23,42,.85);padding:10px 18px;border-radius:10px;backdrop-filter:blur(10px);border:1px solid #10b98133}
.back-link:hover{background:rgba(15,23,42,.95)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:#10b981;transform:scale(1.3)}
.dot:hover:not(.active){background:#475569}
@media(max-width:600px){.slide{padding:80px 20px 120px}.slide-content h1{font-size:1.8rem}.slide-content li{font-size:.95rem}}
</style>
</head>
<body>
<a class="back-link" href="index.html">← Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">◀ Zurück</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter ▶</button>
</div>
<script>
const slides=[{"title": "🐸 Pfeilgiftfrosch", "subtitle": "Dendrobatidae", "content": "Klein, schön — und tödlich", "is_title": true}, {"title": "📋 Steckbrief", "bullets": ["<b>Größe:</b> 1,5–6 cm (je nach Art)", "<b>Gewicht:</b> 1–7 Gramm", "<b>Alter:</b> 3–15 Jahre (in Gefangenschaft bis 20)", "<b>Verbreitung:</b> Mittel- und Südamerika (Tropen)", "<b>Arten:</b> ≈200 Arten in der Familie Dendrobatidae", "<b>Giftigste Art:</b> Phyllobates terribilis (Schrecklicher Pfeilgiftfrosch)"]}, {"title": "🌴 Lebensraum", "bullets": ["Tropische Regenwälder Mittel- und Südamerikas", "Feuchte Laubwälder, entlang von Bächen und Tümpeln", "Bodenbewohner in der Nähe von Epiphyten (Bromelien)", "Höhenlagen von Meereshöhe bis 2.000 m", "Kolumbien, Costa Rica, Brasilien, Ecuador, Peru", "Brauchen konstant hohe Luftfeuchtigkeit (80–100%)"]}, {"title": "🐜 Ernährung", "bullets": ["Insekten: Ameisen, Termiten, Springschwänze, Fruchtfliegen", "Das Gift stammt aus der Nahrung — in Gefangenschaft verlieren sie Giftigkeit!", "Spezielle Alkaloide aus Ameisen werden im Körper gespeichert", "Phyllobates terribilis: 1 mg Gift reicht für 10–20 Menschen", "Batrachotoxin: blockiert Natriumkanäle → Herzstillstand", "Jungfrösche fressen kleinere Beute (Springtails, Milben)"]}, {"title": "💕 Fortpflanzung", "bullets": ["Komplexe Brutpflege — beide Elternteile beteiligt", "Männchen rufen Weibchen mit artspezifischem Gesang an", "Eier werden auf Blättern abgelegt, Männchen bewacht sie", "Kaulquappen werden einzeln in Bromelien-Wassertümpel getragen!", "Einige Arten füttern unbefruchtete Eier an die Kaulquappen", "Metamorphose nach 6–13 Wochen"]}, {"title": "⭐ Besonderheiten", "bullets": ["Aposematismus: Warnfarben signalisieren „ISS MICH NICHT!&quot;", "Farben: Neon-Blau, Feuerrot, Limettengrün — je giftiger, desto auffälliger", "Indigene nutzen das Gift für Blasrohr-Pfeile (→ Name!)", "Phyllobates terribilis: Giftigstes Wirbeltier der Welt", "Einige Arten üben Mimikry — ungiftige Arten ahmen giftige nach", "Epipedobates tricolor: Gift enthält Epibatidin (200x stärker als Morphin)"]}, {"title": "⚠️ Gefährdung", "bullets": ["<b>IUCN-Status:</b> Je nach Art von LC bis CR", "Lebensraumverlust durch Abholzung des Regenwaldes", "Chytridiomykose: Pilzkrankheit dezimiert Amphibien weltweit", "Illegaler Haustierhandel (besonders seltene Farbvarianten)", "Verschmutzung durch Pestizide aus der Landwirtschaft", "Klimawandel verändert Mikrohabitate und Niederschlagsmuster"]}, {"title": "📚 Quellen", "bullets": ["IUCN Red List — Dendrobatidae Species Assessments", "Wikipedia — Pfeilgiftfrösche (Dendrobatidae)", "AmphibiaWeb — Poison Dart Frog Database", "National Geographic — Poison Dart Frogs", "Daly et al. — Batrachotoxin Research (Science)"]}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
if(s.is_title){
el.innerHTML=`<h1>${s.title}</h1><p class="latin">${s.subtitle}</p><p class="tagline">${s.content}</p>`;
} else {
el.innerHTML=`<h1>${s.title}</h1><ul>${s.bullets.map(b=>'<li>'+b+'</li>').join('')}</ul>`;
}
document.getElementById('counter').textContent=`${cur+1} / ${slides.length}`;
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(dir){cur=Math.max(0,Math.min(slides.length-1,cur+dir));render();window.scrollTo(0,0);}
function goSlide(i){cur=i;render();window.scrollTo(0,0);}
const dotsEl=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>goSlide(i);dotsEl.appendChild(d);});
render();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
</body>
</html>
