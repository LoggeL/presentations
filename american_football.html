<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏈 American Football | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#a78bfa,#6d28d9,#a78bfa);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#c4b5fd;text-shadow:0 0 30px #a78bfa44}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#a78bfa33}
.slide-content li::before{content:'\25B8 ';color:#a78bfa;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#a78bfa,#6d28d9);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #a78bfa44}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #a78bfa66}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#c4b5fd;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#a78bfa44}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#a78bfa;transform:scale(1.4);box-shadow:0 0 10px #a78bfa66}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#a78bfa;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #a78bfa66}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "American Football", "subtitle": "Gridiron Glory", "content": "410 Millionen Fans | Super Bowl = groesstes TV-Event | Taktik & Kraft", "is_title": true, "img": "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80"}, {"title": "Steckbrief", "bullets": ["Ursprung: USA, 1869 - erstes Spiel Rutgers vs. Princeton", "Fans: ~410 Millionen, hauptsaechlich USA", "Spieler weltweit: ~10 Millionen", "Feld: 100 Yards (91,44 m) x 53,3 Yards breit", "Spieler pro Team: 11 auf dem Feld, 53 im Kader", "Positionen: Offense, Defense, Special Teams"], "img": "https://images.unsplash.com/photo-1517466787929-bc90951d0974?w=800&q=80"}, {"title": "Regeln & Spielprinzip", "bullets": ["Dauer: 4 x 15 min (effektive Spielzeit ~3 Stunden)", "Ziel: Touchdown (6 Pkt), Field Goal (3 Pkt), Safety (2 Pkt)", "4 Versuche (Downs) fuer 10 Yards - sonst Ballbesitzwechsel", "Passspiel: Quarterback wirft zu Receiver", "Kontakt: Tackling, Blocking - extrem physisch", "Playoff-System: 14 Teams zum Super Bowl im Februar"], "img": "https://images.unsplash.com/photo-1564956037268-8b64741d4cb6?w=800&q=80"}, {"title": "Geschichte", "bullets": ["1869: Erstes Spiel: Rutgers 6 - Princeton 4", "1905: 19 Todesfaelle - Roosevelt greift ein, sicherere Regeln", "1920: NFL gegruendet", "1960: AFL entsteht, 1970 AFL-NFL Merger", "1967: Erster Super Bowl - Packers vs. Chiefs", "Heute: NFL = 15+ Milliarden $ Umsatz/Jahr"], "img": "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=800&q=80"}, {"title": "Groesste Turniere", "bullets": ["Super Bowl: Jaehrlich im Februar, ~115 Mio. US-Zuschauer", "College Football Playoff: NCAA, 12 Teams ab 2024", "NFL Regular Season: 18 Wochen, 272 Spiele", "Pro Bowl: All-Star-Game (wird durch Skills-Challenge ersetzt)", "World Bowl / NFL Europe: Eingestellt 2007, aber Interesse wächst", "Flag Football: Ab 2028 olympisch!"], "img": "https://images.unsplash.com/photo-1581078426770-6d3361515b11?w=800&q=80"}, {"title": "Beruehmte Spieler", "bullets": ["Tom Brady - 7x Super-Bowl-Sieger, GOAT, spielte bis 45", "Joe Montana - 4x Super-Bowl-Sieger, Joe Cool", "Lawrence Taylor - Revolutionierte die Defense", "Jim Brown - Dominanteste RB aller Zeiten, Civil Rights Aktivist", "Jerry Rice - All-time Receiving Leader, 3x Super Bowl"], "img": "https://images.unsplash.com/photo-1615775925005-2774bdb3d3ed?w=800&q=80"}, {"title": "Fun Facts", "bullets": ["Super-Bowl-Werbung: 7 Mio $ fuer 30 Sekunden!", "Ein Football-Spiel hat nur ~11 Minuten tatsaechliche Spielzeit bei 3 Stunden TV", "Die Pittsburgh Steelers haben 6 Super-Bowl-Titel (Rekord mit Patriots)", "Tom Bradys NFL-Gehalt: ~330 Mio $", "Die Lombardi Trophy wiegt 3,2 kg aus Sterlingsilber", "Ein NFL-Football kostet ~100 $ in der Herstellung"], "img": "https://images.unsplash.com/photo-1459865264687-595d652de67e?w=800&q=80"}, {"title": "Quellen", "bullets": ["NFL.com - Offizielle Statistiken", "Pro-Football-Reference.com - Historische Daten", "Wikipedia - American Football", "ESPN - NFL Coverage", "TopEndSports - Most Popular Sports"], "img": null}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
