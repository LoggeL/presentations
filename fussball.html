<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Fußball | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#22c55e,#166534,#22c55e);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#86efac;text-shadow:0 0 30px #22c55e44}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#22c55e33}
.slide-content li::before{content:'\25B8 ';color:#22c55e;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#22c55e,#166534);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #22c55e44}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #22c55e66}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#86efac;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#22c55e44}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#22c55e;transform:scale(1.4);box-shadow:0 0 10px #22c55e66}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#22c55e;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #22c55e66}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "Fußball", "subtitle": "The Beautiful Game", "content": "3,5 Milliarden Fans • 250+ Millionen Spieler • 200+ Laender", "is_title": true, "img": "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&q=80"}, {"title": "Steckbrief", "bullets": ["Ursprung: England, 1863 (FA gegruendet), aber antike Wurzeln in China (Cuju, ~200 v. Chr.)", "Spieler weltweit: ~250 Millionen registriert, ~2,5 Milliarden gelegentlich", "Fans: ~3,5 Milliarden - halber Planet!", "Laender mit Ligen: 200+ (FIFA-Mitglieder)", "Spielfeld: 100-110 m x 64-75 m", "Spieler pro Team: 11 (davon 1 Torwart)"], "img": "https://images.unsplash.com/photo-1553778263-73a83bab9b0c?w=800&q=80"}, {"title": "Regeln & Spielprinzip", "bullets": ["Dauer: 2 x 45 Minuten + Nachspielzeit", "Ziel: Ball ins gegnerische Tor befoerdern", "Abseitsregel: Angreifer darf nicht hinter der letzten Verteidigerlinie stehen", "Freistoss: bei Foulspiel, Elfmeter (11 m) bei Foul im Strafraum", "Gelbe/Rote Karte: Verwarnung bzw. Platzverweis", "Offside, Handspiel, Rueckpassregel machen den Sport taktisch tiefgruendig"], "img": "https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=800&q=80"}, {"title": "Geschichte", "bullets": ["~200 v. Chr.: Cuju in China - aeltester bekannter Vorlaeufer", "1863: Football Association (FA) in London gegruendet", "1900: Olympia-Sportart", "1930: Erste WM in Uruguay - Gastgeber gewinnt", "1958: Pele (17!) wird Weltstar in Schweden", "2022: WM in Katar - Argentiniens dritter Titel unter Messi"], "img": "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80"}, {"title": "Groesste Turniere", "bullets": ["FIFA Weltmeisterschaft: Alle 4 Jahre, 32 Teams (ab 2026: 48!), ~5 Mrd. Zuschauer 2022", "UEFA Champions League: Der Koenigsweg der Clubs", "Englische Premier League: Meistgesehene Liga der Welt", "Copa America: Suedamerikas Nations-Cup, seit 1916", "Afrika Cup: Afrikas groesstes Sportevent", "Frauen-WM: Waechst rasant - 2 Mrd. Zuschauer 2023"], "img": "https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=800&q=80"}, {"title": "Beruehmte Spieler", "bullets": ["Pele - 3x Weltmeister (1958, 1962, 1970), ueber 1.000 Tore", "Diego Maradona - Hand Gottes 1986, das Jahrhundert-Tor", "Lionel Messi - 8x Ballon d'Or, WM-Sieger 2022, GOAT-Diskussion", "Cristiano Ronaldo - 900+ Tore, 5x Champions League", "Zinedine Zidane - Kopfstoss 2006 unvergessen, aber auch: Kunst auf dem Rasen"], "img": "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=800&q=80"}, {"title": "Fun Facts", "bullets": ["Schnellstes Tor: 2,8 Sekunden nach Anpfiff (Nawaf Al-Abed, Saudi-Arabien 2009)", "Rekord-Zuschauer: Estadio Maracana, 1950 - ~200.000", "Groesster Sieg: AS Adema 149-0 Stade Olympique (alle Eigentore als Protest!)", "Fussball ist in 80% aller Laender die Sportart #1", "Die WM 2022 in Katar kostete schaetzungsweise 220 Milliarden Euro", "Ein Bundesligaspieler laeuft ~12 km pro Spiel"], "img": "https://images.unsplash.com/photo-1518604666860-9ed391f76460?w=800&q=80"}, {"title": "Quellen", "bullets": ["FIFA.com - Offizielle Statistiken und Regeln", "Wikipedia - Association Football", "TopEndSports - Most Popular Sports 2025", "UEFA.com - Champions League Archiv", "BBC Sport - Historical Football Records"], "img": null}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
