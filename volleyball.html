<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏐 Volleyball | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#f59e0b,#d97706,#f59e0b);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#fde68a;text-shadow:0 0 30px #f59e0b44}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#f59e0b33}
.slide-content li::before{content:'\25B8 ';color:#f59e0b;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #f59e0b44}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #f59e0b66}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#fde68a;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#f59e0b44}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#f59e0b;transform:scale(1.4);box-shadow:0 0 10px #f59e0b66}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#f59e0b;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #f59e0b66}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "Volleyball", "subtitle": "Bump, Set, Spike!", "content": "800 Millionen Spieler | 900 Millionen Fans | Strand & Halle", "is_title": true, "img": "https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?w=800&q=80"}, {"title": "Steckbrief", "bullets": ["Ursprung: Holyoke, Massachusetts, USA - 1895 von William G. Morgan erfunden", "Spieler weltweit: ~800 Millionen", "Fans: ~900 Millionen", "Feld: 18 m x 9 m, Netz (Maenner: 2,43 m, Frauen: 2,24 m)", "Spieler pro Team: 6", "Varianten: Halle, Beach (2er), Sitting (Paralympics)"], "img": "https://images.unsplash.com/photo-1592656094267-764a45160570?w=800&q=80"}, {"title": "Regeln & Spielprinzip", "bullets": ["Ziel: Ball ueber das Netz auf den Boden der Gegenseite spielen", "Beruehrungen: Maximal 3 pro Team vor der Rueckgabe", "Rally-Point-System: Jeder Ballwechsel = Punkt (seit 1999)", "Saetze: Best of 5, erster auf 25 Punkte (5. Satz bis 15)", "Rotation: Spieler rotieren im Uhrzeigersinn", "Libero: Spezialist fuer Annahme - anderes Trikot"], "img": "https://images.unsplash.com/photo-1574614343663-782a0e469714?w=800&q=80"}, {"title": "Geschichte", "bullets": ["1895: William G. Morgan erfindet Mintonette", "1924: Demonstrationssport bei Olympia (Paris)", "1964: Volleyball wird olympisch (Tokio)", "1996: Beachvolleyball wird olympisch (Atlanta)", "2000er: Brasilien dominiert international", "Heute: FIVB organisiert 222 nationale Verbaende"], "img": "https://images.unsplash.com/photo-1553005746-9245e1904e54?w=800&q=80"}, {"title": "Groesste Turniere", "bullets": ["Olympia: Gold = ultimativer Traum", "FIVB Weltmeisterschaft: Alle 4 Jahre, 24 Teams", "FIVB Nations League: Jaehrlich, Top-Nationen", "Beachvolleyball World Tour: Strand-Spektakel weltweit", "CEV Champions League: Europas Club-Koenigsweg", "Italian Serie A: Staerkste nationale Liga"], "img": "https://images.unsplash.com/photo-1569279382006-5a3e0d3d2524?w=800&q=80"}, {"title": "Beruehmte Spieler", "bullets": ["Karch Kiraly - 3x Olympiasieger (2x Halle, 1x Beach)", "Giba - Brasiliens Gesicht des Volleyballs", "Misty May-Treanor - 3x Beach-Olympiasiegerin", "Sergey Tetyukhin - Russlands Legende, 4x Olympia-Medaille", "Regla Torres - Kubas Wunderfrau, 3x Olympiasiegerin bis 25!"], "img": "https://images.unsplash.com/photo-1613918431703-aa50889e3be2?w=800&q=80"}, {"title": "Fun Facts", "bullets": ["Volleyball wurde als sanftere Alternative zu Basketball erfunden", "Ein Volleyball kann bis zu 130 km/h geschlagen werden", "FIVB hat mehr Mitgliedsverbaende als FIFA (222 vs. 211)", "Der erste Volleyball war ein Basketball-Blasebalg", "Brasilien hat an JEDEM olympischen Turnier seit 1964 teilgenommen", "Beachvolleyball-Spieler testen den Sand auf versteckte Gegenstaende"], "img": "https://images.unsplash.com/photo-1584736328868-fbc3fa670a03?w=800&q=80"}, {"title": "Quellen", "bullets": ["FIVB.com - Internationale Regeln und Turniere", "Wikipedia - Volleyball", "Olympics.com - Volleyball History", "TopEndSports - Most Popular Sports", "CEV.lu - Europaeischer Verband"], "img": null}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
