<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Koenigskobra | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#eab308,#92400e,#eab308);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#fbbf24;text-shadow:0 0 30px #eab30844}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#eab30833}
.slide-content li::before{content:'\25B8 ';color:#eab308;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#eab308,#92400e);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #eab30844}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #eab30866}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#fbbf24;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#eab30844}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#eab308;transform:scale(1.4);box-shadow:0 0 10px #eab30866}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#eab308;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #eab30866}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "🐍 Königskobra", "subtitle": "Ophiophagus hannah", "content": "Die längste Giftschlange der Welt", "is_title": true}, {"title": "📋 Steckbrief", "bullets": ["<b>Größe:</b> 3–5,5 m (max. 5,85 m — längste Giftschlange!)", "<b>Gewicht:</b> 5–10 kg", "<b>Alter:</b> 17–20 Jahre in der Wildnis", "<b>Verbreitung:</b> Süd- und Südostasien (Indien bis Indonesien)", "<b>Name:</b> Ophiophagus = „Schlangenesser&quot; — frisst andere Schlangen", "<b>Familie:</b> Giftnattern (Elapidae)"]}, {"title": "🏜️ Lebensraum", "bullets": ["Dichte tropische und subtropische Wälder", "Bevorzugt in der Nähe von Gewässern und Bambushainen", "Von Meereshöhe bis 2.000 m", "Höhlen, Termitenbauten und Baumhöhlen als Verstecke", "In Indien, Bangladesch, Myanmar, Thailand, Malaysia, Indonesien", "Meidet trockene Wüsten — braucht hohe Luftfeuchtigkeit"]}, {"title": "🐀 Ernährung", "bullets": ["Spezialist: Frisst fast ausschließlich andere Schlangen!", "Beute: Kobras, Kraits, Rattenschlangen, Netzpythons (juvenile)", "Gelegentlich: Echsen und kleine Säugetiere", "Aktiver Jäger — spürt Beute mit der Zunge (Jacobson-Organ)", "Kann andere Giftschlangen fressen und ist immun gegen deren Gift", "Nach dem Biss wartet sie, bis das Gift wirkt"]}, {"title": "💕 Fortpflanzung", "bullets": ["Einzige Schlangenart, die ein Nest baut!", "Männchen und Weibchen bauen gemeinsam ein Blätternest", "Gelege: 20–50 Eier", "Das Weibchen bewacht das Nest aggressiv bis zum Schlüpfen", "Inkubation: 60–80 Tage", "Jungschlangen sind 45–55 cm und haben bereits voll wirksames Gift"]}, {"title": "⭐ Besonderheiten", "bullets": ["Ein Biss enthält genug Gift (≈7 ml), um einen Elefanten zu töten", "Neurotoxin wirkt auf das Nervensystem — Lähmung und Atemstillstand", "Kann sich aufrichten und einem Menschen direkt in die Augen blicken", "Brüllt leise — tiefe knurrende Laute als Warnung", "In Thailand werden Königs-Kobras-Schlangenbeschwörer respektiert", "Antiserum existiert, muss aber schnell verabreicht werden"]}, {"title": "⚠️ Gefährdung", "bullets": ["<b>IUCN-Status:</b> Gefährdet (VU)", "Bestand sinkt — Hauptursache: Lebensraumverlust", "Abholzung der tropischen Wälder für Palmöl-Plantagen", "Gefangennahme für traditionelle Medizin und Haut", "Schlangenbeschwörer-Tradition entfernt Tiere aus der Wildnis", "Straßenverkehr: viele Tiere werden überfahren"]}, {"title": "📚 Quellen", "bullets": ["IUCN Red List: iucnredlist.org/species/177544", "Wikipedia — Königskobra (Ophiophagus hannah)", "National Geographic — King Cobra", "Toxicon — King Cobra Venom Research", "Save The Snake — King Cobra Conservation"]}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
