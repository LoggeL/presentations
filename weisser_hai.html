<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦈 Weißer Hai | Tier-Welt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:6px;background:linear-gradient(135deg,#0c4a6e,#0369a1)}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 40px 120px;position:relative;min-height:calc(100vh - 6px)}
.slide-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0c4a6e,#0369a1);opacity:.12}
.slide-content{position:relative;z-index:1;max-width:800px;width:100%;text-align:center}
.slide-content h1{font-size:2.4rem;margin-bottom:16px;color:#7dd3fc}
.slide-content .latin{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:12px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(30,41,59,.6)}
.slide-content li::before{content:'▸ ';color:#0ea5e9;font-weight:bold}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(30,41,59,.95);border-top:1px solid #334155;backdrop-filter:blur(12px);z-index:50}
.nav button{background:#0ea5e9;color:#0f172a;border:none;padding:12px 28px;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .2s}
.nav button:hover:not(:disabled){transform:scale(1.05)}
.nav button:disabled{opacity:.25;cursor:default}
.counter{color:#94a3b8;font-size:.9rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#7dd3fc;text-decoration:none;font-size:.95rem;background:rgba(15,23,42,.85);padding:10px 18px;border-radius:10px;backdrop-filter:blur(10px);border:1px solid #0ea5e933}
.back-link:hover{background:rgba(15,23,42,.95)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#334155;cursor:pointer;transition:all .2s}
.dot.active{background:#0ea5e9;transform:scale(1.3)}
.dot:hover:not(.active){background:#475569}
@media(max-width:600px){.slide{padding:80px 20px 120px}.slide-content h1{font-size:1.8rem}.slide-content li{font-size:.95rem}}
</style>
</head>
<body>
<a class="back-link" href="index.html">← Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">◀ Zurück</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter ▶</button>
</div>
<script>
const slides=[{"title": "🦈 Weißer Hai", "subtitle": "Carcharodon carcharias", "content": "Das perfekte Raubtier der Ozeane", "is_title": true}, {"title": "📋 Steckbrief", "bullets": ["<b>Größe:</b> 4,5–6,5 m (max. über 7 m)", "<b>Gewicht:</b> 700–1.100 kg (max. ≈3.500 kg)", "<b>Alter:</b> 40–70 Jahre (neue Studien gehen bis 70)", "<b>Verbreitung:</b> Alle Ozeane, bevorzugt gemäßigte bis subtropische Gewässer", "<b>Geschwindigkeit:</b> Bis zu 56 km/h in Kurzstrecken", "<b>Zähne:</b> Bis zu 300, in 3 Reihen — werden ständig ersetzt"]}, {"title": "🌊 Lebensraum", "bullets": ["Alle Ozeane zwischen 12–24°C Wassertemperatur", "Küstennah: Seehund-Kolonien, Robbeninseln", "Tiefen bis 1.200 m, meist aber 0–250 m", "Wanderungen von bis zu 20.000 km pro Jahr", "Hotspots: Südafrika, Australien, Kalifornien, Mittelmeer", "Oft in der Nähe von Seehund-Kolonien anzutreffen"]}, {"title": "🦭 Ernährung", "bullets": ["Hauptbeute: Robben, Seehunde, Seelöwen", "Auch: Fische, Rochen, andere Haie, Tintenfische", "Auskundschaftungs-Biss: 50% der Bisse auf Menschen sind Testbisse", "Ambush-Jagd: Angriff von unten mit &gt;40 km/h", "Können Beute komplett in einem Stück schlucken", "Fressperioden und Fastenperioden wechseln sich ab"]}, {"title": "💕 Fortpflanzung", "bullets": ["Ovovivipar — Eier schlüpfen im Mutterleib", "Intrauteriner Kannibalismus: Stärkste Embryos fressen schwächere", "Tragzeit: 11–18 Monate", "2–10 Jungtiere pro Wurf", "Junge Weiße Haie sind 1,2–1,5 m bei Geburt", "Geschlechtsreife mit 15–20 Jahren — extrem langsam"]}, {"title": "⭐ Besonderheiten", "bullets": ["Ampullae of Lorenzini: Elektrosensoren spüren Herzschläge aus der Ferne", "Seitenlinie spürt Wasserbewegungen bis 1 mm Verschiebung", "Bluttemperatur 14°C über Umgebung (pseudo-endotherm)", "Sprünge bis 3 m aus dem Wasser (Breaching) bei der Jagd", "360° Rundumsicht mit Augen auf beiden Kopfseiten", "Kein einziges nachgewiesenes Menschen-Tötungs-Deliberat — Filme lügen!"]}, {"title": "⚠️ Gefährdung", "bullets": ["<b>IUCN-Status:</b> Gefährdet (VU)", "Weltweite Population: geschätzt 3.000–5.000 Tiere", "Beifang in Fischernetzen und Langleinen", "Haiflossenhandel (Shark Finning) — obwohl illegal", "Meeresverschmutzung und Mikroplastik reichern sich an", "Langsame Fortpflanzung = langsame Erholung"]}, {"title": "📚 Quellen", "bullets": ["IUCN Red List: iucnredlist.org/species/3855", "MarineBio — Great White Shark (Carcharodon carcharias)", "Wikipedia — Weißer Hai", "Shark Research Institute — Global White Shark Study", "Oceana — Great White Shark Conservation"]}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
if(s.is_title){
el.innerHTML=`<h1>${s.title}</h1><p class="latin">${s.subtitle}</p><p class="tagline">${s.content}</p>`;
} else {
el.innerHTML=`<h1>${s.title}</h1><ul>${s.bullets.map(b=>'<li>'+b+'</li>').join('')}</ul>`;
}
document.getElementById('counter').textContent=`${cur+1} / ${slides.length}`;
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}
function go(dir){cur=Math.max(0,Math.min(slides.length-1,cur+dir));render();window.scrollTo(0,0);}
function goSlide(i){cur=i;render();window.scrollTo(0,0);}
const dotsEl=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>goSlide(i);dotsEl.appendChild(d);});
render();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
</body>
</html>
