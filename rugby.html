<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏉 Rugby | Welt-Entdeckungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden;min-height:100vh}
.slide-container{width:100%;min-height:100vh;display:flex;flex-direction:column}
.header-bar{height:4px;background:linear-gradient(90deg,#14b8a6,#0d9488,#14b8a6);background-size:200% 100%;animation:gradientShift 3s ease infinite}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 40px 140px;position:relative;min-height:calc(100vh - 4px)}
.slide-bg{position:absolute;inset:0;overflow:hidden}
.slide-bg img{width:100%;height:100%;object-fit:cover;opacity:.15;filter:blur(1px)}
.slide-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,14,26,.85),rgba(10,14,26,.6))}
.slide-content{position:relative;z-index:1;max-width:820px;width:100%;text-align:center;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.slide-content h1{font-size:2.6rem;font-weight:800;margin-bottom:20px;color:#5eead4;text-shadow:0 0 30px #14b8a644}
.slide-content .subtitle{font-style:italic;color:#94a3b8;font-size:1.15rem;margin-bottom:12px;letter-spacing:.5px}
.slide-content .tagline{font-size:1.4rem;color:#cbd5e1;line-height:1.6}
.slide-content .img-inline{width:100%;max-width:700px;max-height:220px;object-fit:cover;border-radius:16px;margin:20px auto;display:block;box-shadow:0 8px 32px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)}
.glass-card{background:rgba(30,41,59,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,.08);padding:32px;margin-top:24px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.slide-content ul{text-align:left;list-style:none;max-width:720px;margin:0 auto}
.slide-content li{padding:14px 0;font-size:1.05rem;line-height:1.7;border-bottom:1px solid rgba(255,255,255,.06);transition:all .2s}
.slide-content li:hover{padding-left:8px;border-bottom-color:#14b8a633}
.slide-content li::before{content:'\25B8 ';color:#14b8a6;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:rgba(10,14,26,.92);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);z-index:50}
.nav button{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#0a0e1a;border:none;padding:12px 28px;border-radius:12px;font-size:1rem;cursor:pointer;font-weight:700;transition:all .25s;box-shadow:0 4px 15px #14b8a644}
.nav button:hover:not(:disabled){transform:scale(1.05);box-shadow:0 6px 25px #14b8a666}
.nav button:disabled{opacity:.2;cursor:default;transform:none;box-shadow:none}
.counter{color:#94a3b8;font-size:.85rem}
.back-link{position:fixed;top:20px;left:20px;z-index:10;color:#5eead4;text-decoration:none;font-size:.9rem;font-weight:600;background:rgba(10,14,26,.8);padding:10px 20px;border-radius:12px;backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);transition:all .2s}
.back-link:hover{background:rgba(10,14,26,.95);border-color:#14b8a644}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);cursor:pointer;transition:all .3s}
.dot.active{background:#14b8a6;transform:scale(1.4);box-shadow:0 0 10px #14b8a666}
.dot:hover:not(.active){background:rgba(255,255,255,.3)}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:#14b8a6;z-index:100;transition:width .4s ease;box-shadow:0 0 10px #14b8a666}
@media(max-width:600px){.slide{padding:80px 16px 140px}.slide-content h1{font-size:1.9rem}.slide-content li{font-size:.93rem}.glass-card{padding:20px}}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<a class="back-link" href="index.html">&larr; Startseite</a>
<div class="slide-container">
<div class="header-bar"></div>
<div class="slide" id="slideArea">
<div class="slide-bg" id="slideBg"></div>
<div class="slide-content" id="slideContent"></div>
</div>
</div>
<div class="nav">
<button id="prevBtn" onclick="go(-1)">&#9664; Zur&uuml;ck</button>
<div style="text-align:center">
<div class="counter" id="counter"></div>
<div class="dots" id="dots"></div>
</div>
<button id="nextBtn" onclick="go(1)">Weiter &#9654;</button>
</div>
<script>
const slides=[{"title": "Rugby", "subtitle": "Discipline, Respect, Passion", "content": "410 Millionen Fans | Seit 1823 | Haerteste Sportart der Welt?", "is_title": true, "img": "https://images.unsplash.com/photo-1548248823-ce16a73b6d49?w=800&q=80"}, {"title": "Steckbrief", "bullets": ["Ursprung: Rugby School, England, 1823 - William Webb Ellis nimmt Ball in die Hand", "Spieler weltweit: ~8,5 Millionen registriert", "Fans: ~410 Millionen", "Varianten: Rugby Union (15er), Rugby League (13er), Rugby 7s (Olympia)", "Feld: Max. 100 m x 70 m", "Besonders populaer: Neuseeland, Suedafrika, England, Australien, Frankreich"], "img": "https://images.unsplash.com/photo-1584735175315-9d5df23860e6?w=800&q=80"}, {"title": "Regeln & Spielprinzip", "bullets": ["Ziel: Versuch (Try) = Ball auf dem Boden ueber der Linie druecken (5 Punkte)", "Umwandlung: Kick nach Try = 2 Punkte, Strafkick = 3, Drop-Kick = 3", "Vorwaerts passen verboten! Nur Rueckwaerts-/Seitwaertspaessee", "Tackle: Nur Balltraeger darf getackelt werden", "Scrum: 8 vs. 8 - kontrollierte Kollision", "Lineout: Einwurf von der Seite - Spieler werden hochgehoben"], "img": "https://images.unsplash.com/photo-1584362993879-4e0ae3efb1b6?w=800&q=80"}, {"title": "Geschichte", "bullets": ["1823: William Webb Ellis nimmt den Ball und rennt - Legende oder Mythos?", "1871: RFU gegruendet, erstes Laenderspiel: England vs. Schottland", "1895: Spaltung in Union (Amateur) und League (Profi)", "1987: Erste Rugby-Union-WM - Neuseeland gewinnt", "1995: Union wird professionell", "2016: Rugby 7s wird olympisch - Fidschi gewinnt Gold!"], "img": "https://images.unsplash.com/photo-1577223630752-3efe4e573e64?w=800&q=80"}, {"title": "Groesste Turniere", "bullets": ["Rugby World Cup: Alle 4 Jahre, Suedafrika (4x) und Neuseeland (3x)", "Six Nations: England, Frankreich, Irland, Schottland, Wales, Italien", "The Rugby Championship: NZ, Suedafrika, Australien, Argentinien", "British & Irish Lions Tour: Alle 4 Jahre - Kult!", "Super Rugby: Suedhemisphaere-Club-Wettbewerb", "Olympia (7s): Schnell, spektakulaer, Fidschi = Doppel-Gold"], "img": "https://images.unsplash.com/photo-1549924231-f129b911e442?w=800&q=80"}, {"title": "Beruehmte Spieler", "bullets": ["Jonah Lomu - 1,96 m, 120 kg, 4 Versuche vs. England 1995", "Dan Carter - 1.598 Punkte fuer Neuseeland, bester Fly-Half", "Siya Kolisi - Suedafrikas erster schwarzer Kapitaen, 2x Weltmeister", "Brian O'Driscoll - Irlands groesster Spieler, 141 Test-Einsaetze", "Sebastien Chabal - Frankreichs Caveman, baertiger Berserker"], "img": "https://images.unsplash.com/photo-1526232761682-d26e03ac148e?w=800&q=80"}, {"title": "Fun Facts", "bullets": ["Neuseeland (All Blacks) hat eine Gewinnquote von ~77% seit 1903", "Der Haka wird vor jedem Spiel der All Blacks aufgefuehrt", "Ein Rugby-Spiel hat 80 Minuten mit kaum Unterbrechung", "Suedafrika hat die meisten WM-Titel: 4 (1995, 2007, 2019, 2023)", "Die WM-Trophie heisst Webb Ellis Cup", "Rugby-Profis laufen ~7-9 km pro Spiel bei vollem Kontakt"], "img": "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800&q=80"}, {"title": "Quellen", "bullets": ["World.Rugby - Offizielle Regeln und Rangliste", "Wikipedia - Rugby Union", "Olympics.com - Rugby History", "ESPN - Rugby Coverage", "AllBlacks.com - Neuseeland Rugby Archiv"], "img": null}];
let cur=0;
function render(){
const s=slides[cur];
const el=document.getElementById('slideContent');
const bg=document.getElementById('slideBg');
const prog=document.getElementById('progressBar');
prog.style.width=((cur+1)/slides.length*100)+'%';
if(s.img){bg.innerHTML='<img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}
else{bg.innerHTML='';}
let html='';
if(s.is_title){html='<h1>'+s.title+'</h1><p class="subtitle">'+s.subtitle+'</p><p class="tagline">'+s.content+'</p>';}
else{html='<h1>'+s.title+'</h1>';if(s.img){html+='<img class="img-inline" src="'+s.img+'" alt="" onerror="this.style.display=\'none\'">';}html+='<div class="glass-card"><ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul></div>';}
el.innerHTML=html;
el.style.animation='none';el.offsetHeight;el.style.animation='fadeInUp .5s ease';
document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
document.getElementById('prevBtn').disabled=cur===0;
document.getElementById('nextBtn').disabled=cur===slides.length-1;
}
function go(d){cur=Math.max(0,Math.min(slides.length-1,cur+d));render();window.scrollTo(0,0)}
function goTo(i){cur=i;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});
const dotsC=document.getElementById('dots');
slides.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.onclick=()=>goTo(i);dotsC.appendChild(d)});
render();
</script>
</body>
</html>
